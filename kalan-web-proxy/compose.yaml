services:
  kalan-web-proxy:
    build: .
    container_name: kalan-web-proxy-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
