<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>KALAN Web — Local Development</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,sans-serif;background:#090b12;color:#f2f4fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(720px,100%);border:1px solid #292d42;border-radius:18px;background:#111622;padding:28px;box-shadow:0 24px 80px #0008}
    .brand{font-size:12px;letter-spacing:3px;color:#a995ff;font-weight:800}
    h1{font-size:clamp(30px,6vw,48px);margin:14px 0 8px}
    p{color:#aab2c5;line-height:1.6}
    .bar{display:flex;gap:10px;margin-top:24px}
    input{min-width:0;flex:1;background:#090d17;border:1px solid #343b53;border-radius:9px;padding:13px;color:#fff}
    button{border:0;border-radius:9px;padding:0 18px;background:#8b6cff;color:white;font-weight:700}
    .notice{margin-top:22px;padding:14px;border-radius:10px;background:#201b32;border:1px solid #3a315c;color:#d7ceff;font-size:13px}
    code{color:#fff}
  </style>
</head>
<body>
  <main>
    <div class="brand">KALANGAMER / BROWSER</div>
    <h1>KALAN Web</h1>
    <p>The local development service is running. The browser proxy engine has not been connected yet.</p>
    <div class="bar">
      <input aria-label="Website address" placeholder="Enter a website address" disabled>
      <button type="button" disabled>Go</button>
    </div>
    <div class="notice">Development shell only — local access is restricted to this PC. Browsing is not enabled yet.</div>
    <p id="status">Checking service…</p>
  </main>
  <script>
    fetch("/healthz").then(r=>r.json()).then(data=>{
      document.getElementById("status").textContent =
        data.ok ? "Service status: running · Proxy ready: no" : "Service check failed";
    }).catch(()=>{
      document.getElementById("status").textContent = "Service check failed";
    });
  </script>
</body>
</html>
