<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>KALAN Web</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Arial,sans-serif;background:#080a12;color:#f3f2fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#282044 0,transparent 55%),#080a12}
    header{min-height:68px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #29253a;background:#0c0e18;flex-wrap:wrap}
    .brand{font-size:12px;letter-spacing:2px;font-weight:800;color:#c5aaff;white-space:nowrap}
    .controls{display:flex;gap:6px}
    button{cursor:pointer;border:1px solid #373149;background:#171725;color:#eee;border-radius:9px;padding:9px 12px}
    button:hover{background:#28213b}
    button:focus-visible,input:focus-visible{outline:2px solid #aa8cff;outline-offset:2px}
    .address{display:flex;gap:8px;flex:1;min-width:220px}
    input{width:100%;min-width:0;background:#101321;border:1px solid #38334e;border-radius:9px;padding:11px 13px;color:#fff;outline:none}
    #go{background:#8865ec;border-color:#8865ec;font-weight:700;padding-inline:20px}
    #status{font-size:12px;color:#9d9bb0;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
    #tabs{height:44px;display:flex;align-items:end;gap:6px;padding:6px 12px 0;background:#090b13;border-bottom:1px solid #29253a;overflow-x:auto}
    .tab{display:flex;align-items:center;min-width:110px;max-width:220px;height:36px;border:1px solid #302b42;border-bottom:0;border-radius:9px 9px 0 0;background:#111321}
    .tab.active{background:#242039;border-color:#65518d}
    .tab-select{flex:1;min-width:0;border:0;background:transparent;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 10px}
    .tab-close{border:0;background:transparent;padding:5px 9px;color:#aaa}
    #new-tab{margin-left:2px;margin-bottom:4px;border-radius:8px;padding:5px 11px}
    main{height:calc(100vh - 112px);padding:12px;min-height:0;overflow:hidden}
    #home{height:100%;display:grid;place-items:center;text-align:center}
    #home[hidden],.browser-frame[hidden]{display:none!important}
    .welcome{max-width:650px;padding:32px}
    .eyebrow{color:#aa8cff;letter-spacing:3px;font-size:11px;font-weight:800}
    h1{font-size:clamp(38px,7vw,68px);margin:12px 0}
    p{color:#aaa9bd;line-height:1.7}
    .hint{margin:26px auto 0;padding:12px 16px;border:1px solid #39304f;border-radius:10px;background:#171322;color:#cfc4f1;font-size:12px;max-width:500px}
    #home-button{margin-top:14px}
    #browser-stage{height:100%;width:100%}
    .browser-frame{display:block;width:100%;height:100%;border:1px solid #302b42;border-radius:12px;background:white}
    @media(max-width:760px){header{align-items:stretch}.brand{width:100%}#status{max-width:100%;width:100%}.controls button{padding:8px}main{height:calc(100vh - 164px);padding:8px}}
  </style>
</head>
<body>
  <header>
    <div class="brand">KALANGAMER / KALAN WEB</div>
    <div class="controls" aria-label="Browser controls">
      <button id="back" type="button" aria-label="Back">←</button>
      <button id="forward" type="button" aria-label="Forward">→</button>
      <button id="reload" type="button" aria-label="Reload">↻</button>
      <button id="home-button" type="button" aria-label="New tab home">⌂</button>
    </div>
    <form class="address" id="address-form" onsubmit="return false">
      <input id="address" type="text" placeholder="Search or enter a website address" autocomplete="off" spellcheck="false" aria-label="Search or enter a website address">
      <button id="go" type="button">Go</button>
    </form>
    <div id="status" role="status">Starting…</div>
  </header>
  <nav id="tabs" aria-label="Browser tabs">
    <button id="new-tab" type="button" aria-label="Open new tab">+</button>
  </nav>
  <main>
    <section id="home">
      <div class="welcome">
        <div class="eyebrow">YOUR WEB, YOUR WAY</div>
        <h1 id="home-title">KALAN Web</h1>
        <p id="home-copy">A browser built into KALANGAMER. Search the web or enter a website address above.</p>
        <div class="hint">Local development preview. This service is currently available only on the PC hosting it.</div>
      </div>
    </section>
    <div id="browser-stage"></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
