name: Prepare self-hosted Minecraft 1.8 WASM

on:
  push:
    branches: [main]
    paths-ignore:
      - "games/minecraft-18/EaglercraftX-1.8-WASM.html"

permissions:
  contents: write

jobs:
  fetch-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KALANGAMER
        uses: actions/checkout@v4

      - name: Download the public EaglercraftX 1.8 WASM build
        run: |
          mkdir -p games/minecraft-18
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/MilkdromedaStudios/all-of-eaglercraft/main/EaglercraftX%201.8%20WASM.html" \
            --output games/minecraft-18/EaglercraftX-1.8-WASM.html
          test "$(wc -c < games/minecraft-18/EaglercraftX-1.8-WASM.html)" -gt 15000000

      - name: Commit hosted game client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/minecraft-18/EaglercraftX-1.8-WASM.html
          if git diff --cached --quiet; then
            echo "Client is already up to date."
            exit 0
          fi
          git commit -m "Add self-hosted Minecraft 1.8 WASM client"
          git push
