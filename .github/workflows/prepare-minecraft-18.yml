name: Prepare self-hosted Minecraft 1.8 WASM

on:
  push:
    branches: [main]
    paths-ignore:
      - "games/minecraft-18/**"

permissions:
  contents: write

jobs:
  fetch-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KALANGAMER
        uses: actions/checkout@v4

      - name: Download the matching official u53 WASM package
        run: |
          mkdir -p games/minecraft-18 /tmp/eagler-u53
          curl --fail --location --retry 3 \
            "https://cdn.eaglercraft.ru/dl/1.8.8/EaglercraftX_1.8_u53_WASM-GC_Offline.zip" \
            --output /tmp/eagler-u53.zip
          unzip -q /tmp/eagler-u53.zip -d /tmp/eagler-u53
          echo "Archive contents:"
          find /tmp/eagler-u53 -maxdepth 3 -type f | head -80

          # Keep the original requested u53 HTML, but use resources from the
          # matching official u53 package rather than a different community build.
          asset="$(find /tmp/eagler-u53 -type f -name 'assets.epk' -print -quit)"
          test -n "$asset"
          cp "$asset" games/minecraft-18/assets.epk

          mkdir -p games/minecraft-18/lang
          find /tmp/eagler-u53 -type f \( -name '*.lang' -o -name '*.json' \) -path '*/lang/*' -exec cp {} games/minecraft-18/lang/ \;
          test "$(find games/minecraft-18/lang -type f | wc -l)" -gt 0
          echo "Matching language resources:"
          find games/minecraft-18/lang -maxdepth 1 -type f | head -20

      - name: Commit hosted game resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/minecraft-18/
          if git diff --cached --quiet; then
            echo "Resources are already up to date."
            exit 0
          fi
          git commit -m "Use matching official Minecraft 1.8.8 u53 resources"
          git push
