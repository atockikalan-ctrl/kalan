name: Prepare self-hosted Minecraft 1.13.2

on:
  push:
    branches: [main]
    paths-ignore:
      - "games/minecraft-1132/**"

permissions:
  contents: write

jobs:
  fetch-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KALANGAMER
        uses: actions/checkout@v4

      - name: Download Eaglercraft 1.13.2 English client
        run: |
          mkdir -p games/minecraft-1132
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/MilkdromedaStudios/all-of-eaglercraft/main/Eaglercraft%201.13.2%20EN.html" \
            --output games/minecraft-1132/Eaglercraft-1.13.2-EN.html

          size="$(wc -c < games/minecraft-1132/Eaglercraft-1.13.2-EN.html)"
          echo "Downloaded client size: $size bytes"
          test "$size" -gt 10000000
          # Cloudflare Pages has a per-file upload limit; fail clearly if exceeded.
          test "$size" -lt 25000000

      - name: Remove the broken 1.8.8 client and commit 1.13.2
        run: |
          rm -rf games/minecraft-18
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A games/minecraft-18/ games/minecraft-1132/
          if git diff --cached --quiet; then
            echo "Minecraft 1.13.2 client is already up to date."
            exit 0
          fi
          git commit -m "Replace Minecraft 1.8.8 with Eaglercraft 1.13.2"
          git push
