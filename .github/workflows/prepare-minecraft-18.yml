name: Prepare self-hosted Minecraft 1.8 WASM

on:
  push:
    branches: [main]
    paths-ignore:
      - "games/minecraft-18/**"

permissions:
  contents: write

jobs:
  fetch-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KALANGAMER
        uses: actions/checkout@v4

      - name: Download the complete official EaglercraftX u53 WASM client
        run: |
          mkdir -p games/minecraft-18 /tmp/eagler-u53
          curl --fail --location --retry 3 \
            "https://cdn.eaglercraft.ru/dl/1.8.8/EaglercraftX_1.8_u53_WASM-GC_Offline.zip" \
            --output /tmp/eagler-u53.zip
          unzip -q /tmp/eagler-u53.zip -d /tmp/eagler-u53

          # The official offline HTML is a complete self-contained client.
          client="$(find /tmp/eagler-u53 -type f -name 'EaglercraftX_1.8_u53_WASM-GC_Offline.html' -print -quit)"
          test -n "$client"
          cp "$client" games/minecraft-18/EaglercraftX-1.8-WASM.html
          test "$(wc -c < games/minecraft-18/EaglercraftX-1.8-WASM.html)" -gt 10000000

          # Remove the mismatched external resources from the earlier attempt.
          rm -rf games/minecraft-18/assets.epk games/minecraft-18/lang

      - name: Commit complete hosted game client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A games/minecraft-18/
          if git diff --cached --quiet; then
            echo "Client is already up to date."
            exit 0
          fi
          git commit -m "Replace Minecraft 1.8 with complete official u53 client"
          git push
