<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft 1.13.2</title>
<style>html,body{margin:0;width:100%;height:100%;background:#111;color:#eee;font:16px system-ui;display:grid;place-items:center}#status{text-align:center;padding:24px}</style>
</head><body><div id="status">Loading Minecraft 1.13.2…<br><small>Downloading game files</small></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const parts=[];
    for(let i=0;i<3;i++){
      const name='client.part'+String(i).padStart(2,'0');
      const response=await fetch(name);
      if(!response.ok) throw new Error('Could not load '+name+' ('+response.status+')');
      parts.push(await response.blob());
      status.innerHTML='Loading Minecraft 1.13.2…<br><small>Downloaded part '+(i+1)+' of 3</small>';
    }
    const compressed=new Blob(parts);
    if(!('DecompressionStream' in window)) throw new Error('This browser does not support gzip decompression.');
    const html=await new Response(compressed.stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    status.textContent='Minecraft could not load: '+error.message;
  }
})();
</script></body></html>
